name: Test and build Python desktop
on:
  workflow_dispatch:
    inputs:
      official_login_smoke:
        description: Check the live ASMP login form with the Windows package
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: macos-15-intel
            target: macos-x86_64
          - os: macos-latest
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-noto-cjk libegl1 libopengl0 libnss3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-shape0 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2 libpulse0 libgbm1
      - run: python -m pip install -r requirements-dev.txt
      - name: Test and package (Windows / macOS)
        if: runner.os != 'Linux'
        run: python tools/build.py
      - name: Test and package (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/build.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: asmp-${{ matrix.target }}
          path: |
            dist/Hikvision-ASMP-v*.zip
            dist/Hikvision-ASMP-v*.tar.gz
            dist/Hikvision-ASMP-v*.sha256
            dist/checksums-v*.txt
          if-no-files-found: error
      - name: Check official ASMP sign-in (Windows)
        if: runner.os == 'Windows' && inputs.official_login_smoke
        shell: pwsh
        run: |
          $probe = Join-Path $PWD '.tmp/official-login-smoke'
          $process = Start-Process -FilePath 'build/frozen/HikvisionASMP/HikvisionASMP.exe' -ArgumentList "--browser-smoke --data-dir `"$probe`"" -WindowStyle Hidden -Wait -PassThru
          Get-Content -LiteralPath (Join-Path $probe 'smoke-console.log')
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          $result = Get-Content -LiteralPath (Join-Path $probe 'smoke-result.json') | ConvertFrom-Json
          if (-not $result.official_page) { throw 'The official ASMP login form was not verified' }
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            .tmp/frozen-smoke-*/smoke-console.log
            .tmp/frozen-smoke-*/smoke-result.json
            .tmp/official-login-smoke/smoke-console.log
            .tmp/official-login-smoke/smoke-result.json
            build/pyinstaller/HikvisionASMP/warn-HikvisionASMP.txt
          include-hidden-files: true
          if-no-files-found: ignore
