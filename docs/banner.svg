<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Hikvision ASMP Submit Tool - portable Windows utility for batch RMA registration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111E"/>
      <stop offset="0.55" stop-color="#0B1B2B"/>
      <stop offset="1" stop-color="#102A3A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3DDC97"/>
      <stop offset="1" stop-color="#1C8C8C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1C8C8C" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#1C8C8C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <circle cx="1110" cy="30" r="230" fill="url(#glow)"/>
  <circle cx="860" cy="290" r="120" fill="#1C8C8C" opacity="0.08" filter="url(#soft)"/>
  <rect x="0" y="0" width="8" height="320" fill="url(#accent)"/>

  <!-- Left: product identity -->
  <rect x="64" y="42" width="286" height="30" rx="15" fill="#0C2634" stroke="#1D5A6B" stroke-width="1"/>
  <circle cx="81" cy="57" r="4" fill="#3DDC97"/>
  <text x="94" y="62" fill="#9FD9D9" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2.2">PORTABLE · WINDOWS 10/11</text>

  <text x="62" y="140" fill="#F4F8FB" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-1">Hikvision ASMP</text>
  <text x="62" y="198" fill="#3DDC97" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-1">Submit Tool</text>
  <text x="64" y="234" fill="#A9BCCB" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="16.5">Batch RMA registration from Excel to ASMP — no installation required.</text>
  <text x="64" y="258" fill="#6F8A9E" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="14">海康威视 ASMP 序列号批量提交工具</text>

  <g font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="11.5" font-weight="600">
    <rect x="64" y="277" width="104" height="26" rx="13" fill="#0D2231" stroke="#1B4052"/>
    <text x="116" y="294" fill="#A9C4D4" text-anchor="middle">PowerShell 5.1</text>
    <rect x="176" y="277" width="94" height="26" rx="13" fill="#0D2231" stroke="#1B4052"/>
    <text x="223" y="294" fill="#A9C4D4" text-anchor="middle">WinForms GUI</text>
    <rect x="278" y="277" width="116" height="26" rx="13" fill="#0D2231" stroke="#1B4052"/>
    <text x="336" y="294" fill="#A9C4D4" text-anchor="middle">Duplicate guard</text>
    <rect x="402" y="277" width="92" height="26" rx="13" fill="#0D2231" stroke="#1B4052"/>
    <text x="448" y="294" fill="#A9C4D4" text-anchor="middle">SHA-256</text>
  </g>

  <!-- Right: submission card -->
  <g filter="url(#shadow)">
    <rect x="866" y="44" width="338" height="232" rx="18" fill="#0A1725" stroke="#1D3A4E" stroke-width="1.2"/>
  </g>
  <rect x="866" y="44" width="338" height="232" rx="18" fill="none" stroke="#3DDC97" stroke-opacity="0.15"/>

  <circle cx="892" cy="68" r="5" fill="#FF6B6B"/>
  <circle cx="909" cy="68" r="5" fill="#FFC857"/>
  <circle cx="926" cy="68" r="5" fill="#3DDC97"/>
  <text x="1162" y="73" fill="#5F7E93" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="10.5" text-anchor="end" letter-spacing="1.5">RMA BATCH</text>
  <line x1="886" y1="88" x2="1184" y2="88" stroke="#1B3447" stroke-width="1"/>

  <text x="892" y="116" fill="#DDEAF2" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="600">Serial numbers</text>
  <text x="1178" y="116" fill="#3DDC97" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="12" text-anchor="end">24 queued</text>

  <g font-family="Consolas, Segoe UI, Arial, sans-serif" font-size="12">
    <rect x="892" y="130" width="278" height="28" rx="6" fill="#0E2232"/>
    <circle cx="906" cy="144" r="6" fill="#3DDC97" opacity="0.18"/>
    <path d="M903 144 l2.2 2.2 4-4.2" fill="none" stroke="#3DDC97" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="920" y="148" fill="#84A3B8">DEMO000001</text>
    <text x="1160" y="148" fill="#3DDC97" text-anchor="end">OK</text>

    <rect x="892" y="164" width="278" height="28" rx="6" fill="#0E2232"/>
    <circle cx="906" cy="178" r="6" fill="#3DDC97" opacity="0.18"/>
    <path d="M903 178 l2.2 2.2 4-4.2" fill="none" stroke="#3DDC97" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="920" y="182" fill="#84A3B8">DEMO000002</text>
    <text x="1160" y="182" fill="#3DDC97" text-anchor="end">OK</text>

    <rect x="892" y="198" width="278" height="28" rx="6" fill="#0E2232"/>
    <circle cx="906" cy="212" r="6" fill="#FFC857" opacity="0.16"/>
    <circle cx="906" cy="212" r="2.2" fill="#FFC857"/>
    <text x="920" y="216" fill="#84A3B8">DEMO000003</text>
    <text x="1160" y="216" fill="#FFC857" text-anchor="end">WAIT</text>
  </g>

  <rect x="892" y="240" width="278" height="6" rx="3" fill="#132B3D"/>
  <rect x="892" y="240" width="182" height="6" rx="3" fill="url(#accent)"/>
  <text x="892" y="264" fill="#5F7E93" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="10.5">18 / 24 submitted</text>
  <text x="1178" y="264" fill="#5F7E93" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="10.5" text-anchor="end">TLS 1.2</text>
</svg>
