[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hikvision-asmp-tools"
version = "2.1.0"
description = "Cross-platform ASMP registration desktop application"
requires-python = ">=3.11"
dependencies = ["PySide6==6.12.0", "httpx==0.28.1"]
license = "MIT"

[project.gui-scripts]
asmp-tool = "asmp_tool.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["src"]
addopts = "-ra"
